[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
broadcast = "../runtime/broadcast"
libs = ["../../contracts/lib"]
allow_paths = ["../../contracts"]
solc_version = "0.8.26"
evm_version = "cancun"
# Robinhood Nitro permits 96 KiB runtime code. Advanced factory exceeds Ethereum EIP-170.
code_size_limit = 98304
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "../artifacts" }, { access = "read-write", path = "../runtime" }]
remappings = [
  "contracts/=../../contracts/",
  "carbon/=../../contracts/",
  "@openzeppelin/contracts/=../../contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../contracts/lib/forge-std/src/",
  "@uniswap/v4-core/=../../contracts/lib/v4-periphery/lib/v4-core/",
  "v4-core/=../../contracts/lib/v4-periphery/lib/v4-core/src/",
  "v4-periphery/=../../contracts/lib/v4-periphery/",
  "permit2/=../../contracts/lib/v4-periphery/lib/permit2/",
  "solmate/=../../contracts/lib/v4-periphery/lib/v4-core/lib/solmate/",
  "openzeppelin-contracts/=../../contracts/lib/openzeppelin-contracts/"
]

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
